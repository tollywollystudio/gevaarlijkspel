name: Uitrollen naar mijn.host

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uitrollen
  cancel-in-progress: false

jobs:
  uitrollen:
    runs-on: ubuntu-latest
    environment: productie
    steps:
      - uses: actions/checkout@v4

      - name: lftp installeren
        run: |
          for poging in 1 2 3 4; do
            command -v lftp && break
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq lftp && break
            echo "installeren lukte niet (poging $poging), even wachten"
            sleep 30
          done
          command -v lftp

      - name: Versienummer aan stijl en scripts hangen
        run: |
          V="${GITHUB_SHA:0:8}"
          sed -i -E "s/(gs\.css|gs\.js|figuren\.js)\"/\1?v=$V\"/g" *.html
          grep -c "?v=$V" *.html

      - name: Bestanden naar de server sturen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_GEBRUIKER: ${{ secrets.SFTP_GEBRUIKER }}
          SFTP_WACHTWOORD: ${{ secrets.SFTP_WACHTWOORD }}
        run: |
          set -e
          test -n "$SFTP_HOST" && test -n "$SFTP_GEBRUIKER" && test -n "$SFTP_WACHTWOORD" || { echo "Een van de drie geheimen ontbreekt in de omgeving productie."; exit 1; }
          BASIS='set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes;'
          # FTP alleen versleuteld, met controle van het certificaat van de server.
          BASIS="$BASIS set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:ca-file /etc/ssl/certs/ca-certificates.crt;"
          SOORT=sftp
          L() { LFTP_PASSWORD="$SFTP_WACHTWOORD" lftp --env-password -u "$SFTP_GEBRUIKER" "$SOORT://$SFTP_HOST" -e "$BASIS $1; bye"; }
          # Eerst de verbinding testen, zodat een fout hier zichtbaar is.
          echo "Verbinding testen en startmap tonen:"
          if ! L "pwd; cls -1"; then
            echo "SFTP lukte niet. Nu via versleuteld FTP:"
            SOORT=ftp
            L "pwd; cls -1" || { echo "Inloggen lukte niet via SFTP en niet via versleuteld FTP. Controleer host, gebruiker en wachtwoord."; exit 1; }
          fi
          echo "Verbonden via $SOORT."
          # Zoek de webmap: eerst de map van het domein, anders public_html, anders de startmap zelf als daar al een index staat.
          DOEL=""
          for MAP in domains/gevaarlijkspel.nl/public_html public_html private_html httpdocs www; do
            if L "cd $MAP" >/dev/null 2>&1; then DOEL="$MAP"; break; fi
          done
          test -n "$DOEL" || { echo "Geen webmap gevonden. Zie de lijst hierboven voor wat er in de startmap staat."; exit 1; }
          echo "Webmap: $DOEL"
          L "mirror --reverse --verbose --only-newer --no-perms --exclude-glob .git/ --exclude-glob .github/ --exclude README.md ./ $DOEL/"
